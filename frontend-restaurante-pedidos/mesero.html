  <script>
  // Tabbed Menu
  function openMenu(evt, menuName) {
    var i, x, tablinks;
    x = document.getElementsByClassName("menu");
    for (i = 0; i < x.length; i++) {
       x[i].style.display = "none";
    }
    tablinks = document.getElementsByClassName("tablink");
    for (i = 0; i < x.length; i++) {
       tablinks[i].className = tablinks[i].className.replace(" w3-red", "");
    }
    document.getElementById(menuName).style.display = "block";
    evt.currentTarget.firstElementChild.className += " w3-red";
  }
  //document.getElementById("myLink").click();
  </script>
  <!-- Modal Agregar Pedido -->
  <div class="modal fade" id="modalAgregarPedido" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="formAgregarPedido" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nuevo Pedido</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Platillo</label>
            <input type="text" class="form-control" id="inputPlatillo" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" class="form-control" id="inputCantidad" value="1" min="1" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mesa / Cliente</label>
            <input type="text" class="form-control" id="inputMesa" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Observaciones (opcional)</label>
            <input type="text" class="form-control" id="inputObservaciones">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Agregar</button>
        </div>
      </form>
    </div>
  </div>
